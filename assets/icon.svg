<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Gradients for 3D Isometric Cube Faces -->
    <linearGradient id="top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="right-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <filter id="cube-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ground Ambient Ring (Orbit) -->
  <ellipse cx="128" cy="204" rx="72" ry="24" fill="none" stroke="#0EA5E9" stroke-width="6" stroke-dasharray="12 8" opacity="0.4" />

  <!-- 3D Floating Isometric Cube -->
  <g filter="url(#cube-shadow)">
    <!-- Top Face -->
    <polygon points="128,40 196,78 128,116 60,78" fill="url(#top-grad)" />

    <!-- Left Face -->
    <polygon points="60,78 128,116 128,194 60,156" fill="url(#left-grad)" />

    <!-- Right Face -->
    <polygon points="128,116 196,78 196,156 128,194" fill="url(#right-grad)" />

    <!-- Three Coordinate Axes Accents -->
    <line x1="128" y1="116" x2="128" y2="40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="128" y1="116" x2="60" y2="156" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="128" y1="116" x2="196" y2="156" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Center Node / Vertex Highlight -->
    <circle cx="128" cy="116" r="6" fill="#FFFFFF" />
  </g>
</svg>
